<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Walk Plus</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #msg { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #fff; font-size: 16px; pointer-events: none; padding: 0 16px; text-shadow: 0 1px 3px #000; }
  #VRButton { font-size: 28px !important; padding: 22px 40px !important; width: auto !important; left: 50% !important; transform: translateX(-50%); bottom: 60px !important; border: 3px solid #fff !important; background: rgba(0,0,0,0.6) !important; opacity: 1 !important; }
  #diag { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #ff0; font-size: 18px; pointer-events: none; text-shadow: 0 1px 3px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="msg">Loading your garden...</div>
<div id="diag">Checking VR...</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ===== EASY SETTINGS (change true to false to switch something off) =====
const SHOW = { petals: true, butterflies: true, lanterns: true, sound: true, fireflies: true };
const NEAR = 1.6;        // ground under your feet (1.6 = floor level)
const FAR = 6.0;         // bigger = deeper scene
const WALK_LIMIT = 1.5;  // meters you can walk from the center
const MOVE_SPEED = 1.2;
const TURN_SPEED = 1.5;
const SOUND_VOLUME = 0.5; // 0 = silent, 1 = loud
// Lantern spots in the picture (0..1 from left, 0..1 from top)
const LANTERNS = [[0.350,0.395],[0.404,0.385],[0.4175,0.51],[0.5075,0.45],[0.524,0.565],[0.605,0.45],[0.625,0.41],[0.6775,0.49]];
// =======================================================================

const HFOV = 75, CUT = 0.25;
const msg = document.getElementById('msg');
(async () => {
  const d = document.getElementById('diag');
  const secure = window.isSecureContext, hasXR = 'xr' in navigator;
  let vr = 'no';
  try { if (hasXR) vr = (await navigator.xr.isSessionSupported('immersive-vr')) ? 'yes' : 'no'; } catch (e) { vr = 'error: ' + e.message; }
  d.textContent = 'Secure link: ' + (secure ? 'yes' : 'NO') + '  |  WebXR: ' + (hasXR ? 'yes' : 'NO') + '  |  VR mode: ' + vr;
})();

function loadImage(names) {
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= names.length) { reject(new Error('Could not find file: ' + names[0])); return; }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => { i++; tryNext(); };
      img.src = names[i];
    };
    tryNext();
  });
}

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.3, 'rgba(255,240,180,0.6)');
  gr.addColorStop(1, 'rgba(255,220,120,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

try {
  const [photo, depthImg] = await Promise.all([
    loadImage(['photo.png', 'photo.jpg', 'photo.jpeg', 'photo.webp']),
    loadImage(['depth.png', 'depth.jpg'])
  ]);

  const aspect = photo.naturalWidth / photo.naturalHeight;
  const is360 = aspect > 1.9 && aspect < 2.1;
  const cols = is360 ? 512 : 320;
  const rows = is360 ? 256 : Math.max(2, Math.min(400, Math.round(320 / aspect)));

  const c = document.createElement('canvas');
  c.width = cols + 1; c.height = rows + 1;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(depthImg, 0, 0, cols + 1, rows + 1);
  const px = ctx.getImageData(0, 0, cols + 1, rows + 1).data;
  const depthAt = (ix, iy) => px[(iy * (cols + 1) + ix) * 4] / 255;

  const t = Math.tan(THREE.MathUtils.degToRad(HFOV / 2));
  const dirFor = (u, v) => {
    if (is360) {
      const lon = (u - 0.5) * Math.PI * 2, lat = (0.5 - v) * Math.PI;
      return new THREE.Vector3(Math.sin(lon) * Math.cos(lat), Math.sin(lat), -Math.cos(lon) * Math.cos(lat));
    }
    return new THREE.Vector3((u - 0.5) * 2 * t, (0.5 - v) * 2 * t / aspect, -1).normalize();
  };
  const radiusFor = (d) => FAR - d * (FAR - NEAR);

  const positions = [], uvs = [], indices = [], dvals = [], backPositions = [], backIndices = [];
  const BACK = FAR * 1.3;
  for (let iy = 0; iy <= rows; iy++) {
    for (let ix = 0; ix <= cols; ix++) {
      const u = ix / cols, v = iy / rows, d = depthAt(ix, iy);
      const dir = dirFor(u, v), r = radiusFor(d);
      positions.push(dir.x * r, dir.y * r + 1.6, dir.z * r);
      backPositions.push(dir.x * BACK, dir.y * BACK + 1.6, dir.z * BACK);
      uvs.push(u, 1 - v);
      dvals.push(d);
    }
  }
  for (let iy = 0; iy < rows; iy++) {
    for (let ix = 0; ix < cols; ix++) {
      const a = iy * (cols + 1) + ix, b = a + 1, c2 = a + cols + 1, d2 = c2 + 1;
      backIndices.push(a, c2, b, b, c2, d2);
      const mx = Math.max(dvals[a], dvals[b], dvals[c2], dvals[d2]);
      const mn = Math.min(dvals[a], dvals[b], dvals[c2], dvals[d2]);
      if (mx - mn > CUT) continue;
      indices.push(a, c2, b, b, c2, d2);
    }
  }

  const tex = new THREE.Texture(photo);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b8e8);
  const makeMesh = (pos, idx) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    return new THREE.Mesh(g, mat);
  };
  scene.add(makeMesh(positions, indices));
  scene.add(makeMesh(backPositions, backIndices)); // fills holes, no black

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 100);
  camera.position.set(0, 1.6, 0);
  camera.rotation.order = 'YXZ';
  const rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  const glow = glowTexture();
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---- 1. Falling petals ----
  let petals = null; const petalData = [];
  if (SHOW.petals) {
    const N = 120;
    const pg = new THREE.PlaneGeometry(0.045, 0.032);
    petals = new THREE.InstancedMesh(pg, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), N);
    const cols3 = [0xff8fa8, 0xff6b6b, 0xffffff, 0xffc2d1];
    for (let i = 0; i < N; i++) {
      petalData.push({ x: rand(-3, 3), y: rand(0, 3.5), z: rand(-3, 3), s: rand(0.15, 0.35), ph: rand(0, 6.28), rx: rand(0, 6.28), ry: rand(0, 6.28) });
      petals.setColorAt(i, new THREE.Color(cols3[i % cols3.length]));
    }
    scene.add(petals);
  }

  // ---- 2. Butterflies ----
  const butterflies = [];
  if (SHOW.butterflies) {
    const colors = [0xffa53b, 0xffe14d, 0x7ec8ff, 0xff7bd0, 0xffffff, 0xb48cff];
    for (let i = 0; i < 6; i++) {
      const m = new THREE.MeshBasicMaterial({ color: colors[i], side: THREE.DoubleSide });
      const wg = new THREE.PlaneGeometry(0.07, 0.06); wg.rotateX(-Math.PI / 2);
      const rg = wg.clone(); rg.translate(0.035, 0, 0);
      const lg = wg.clone(); lg.translate(-0.035, 0, 0);
      const right = new THREE.Mesh(rg, m), left = new THREE.Mesh(lg, m);
      const body = new THREE.Group(); body.add(right, left);
      const holder = new THREE.Group(); holder.add(body);
      scene.add(holder);
      const ang = rand(0, 6.28), dist = rand(1.6, 3);
      butterflies.push({ holder, right, left, cx: Math.cos(ang) * dist, cz: Math.sin(ang) * dist, cy: rand(0.9, 1.9), a: rand(0.5, 1.1), sp: rand(0.25, 0.5), ph: rand(0, 6.28) });
    }
  }

  // ---- 3. Glowing, swaying lanterns ----
  const lanternGlows = [];
  if (SHOW.lanterns && is360) {
    const lm = new THREE.SpriteMaterial({ map: glow, color: 0xffd98a, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
    LANTERNS.forEach(([u, v], i) => {
      const ix = Math.round(u * cols), iy = Math.round(v * rows);
      const r = radiusFor(depthAt(ix, iy)) * 0.95;
      const p = dirFor(ix / cols, iy / rows).multiplyScalar(r); p.y += 1.6;
      const s = new THREE.Sprite(lm.clone());
      s.position.copy(p); s.scale.setScalar(0.7);
      scene.add(s);
      lanternGlows.push({ s, base: p.clone(), ph: i * 1.7 });
    });
  }

  // ---- 5. Fireflies (brighter when you look up) ----
  let fireflies = null; const ffBase = [];
  if (SHOW.fireflies) {
    const N = 60, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = rand(0, 6.28), d = rand(0.8, 3.2);
      ffBase.push([Math.cos(a) * d, rand(2.0, 3.8), Math.sin(a) * d, rand(0, 6.28)]);
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    fireflies = new THREE.Points(fg, new THREE.PointsMaterial({ map: glow, color: 0xfff3a0, size: 0.09, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(fireflies);
  }

  // ---- 4. Walk zone ring ----
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(WALK_LIMIT - 0.03, WALK_LIMIT, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthTest: false })
  );
  ring.position.y = 0.03; ring.renderOrder = 10;
  scene.add(ring);

  // ---- Sound: wind + birds, made by code ----
  let audio = null;
  function startAudio() {
    if (!SHOW.sound) return;
    if (audio) { audio.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    const master = audio.createGain(); master.gain.value = SOUND_VOLUME; master.connect(audio.destination);
    // wind
    const len = audio.sampleRate * 3, buf = audio.createBuffer(1, len, audio.sampleRate), data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }
    const noise = audio.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const wg = audio.createGain(); wg.gain.value = 0.12;
    noise.connect(lp).connect(wg).connect(master); noise.start();
    setInterval(() => { wg.gain.setTargetAtTime(rand(0.05, 0.18), audio.currentTime, 1.5); }, 3000);
    // birds
    const chirp = () => {
      const notes = 2 + Math.floor(Math.random() * 4), base = rand(2200, 3600);
      let tt = audio.currentTime + 0.05;
      for (let n = 0; n < notes; n++) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(base, tt);
        o.frequency.exponentialRampToValueAtTime(base * rand(1.2, 1.6), tt + 0.08);
        g.gain.setValueAtTime(0, tt);
        g.gain.linearRampToValueAtTime(0.05, tt + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.1);
        o.connect(g).connect(master); o.start(tt); o.stop(tt + 0.12);
        tt += rand(0.1, 0.18);
      }
      setTimeout(chirp, rand(1800, 6000));
    };
    setTimeout(chirp, 1000);
  }
  addEventListener('pointerdown', startAudio);
  addEventListener('click', startAudio);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  renderer.xr.addEventListener('sessionstart', startAudio);
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (e.buttons && !renderer.xr.isPresenting) {
      camera.rotation.y -= e.movementX * 0.005;
      camera.rotation.x = Math.max(-1.4, Math.min(1.4, camera.rotation.x - e.movementY * 0.005));
    }
  });
  // PC test: W A S D to walk
  const keys = {};
  addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  const clock = new THREE.Clock(), dummy = new THREE.Object3D();
  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), head = new THREE.Vector3(), look = new THREE.Vector3();

  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1), time = clock.elapsedTime;
    const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;

    // movement
    let mx = 0, my = 0;
    const session = renderer.xr.getSession();
    if (session) {
      for (const src of session.inputSources) {
        const gp = src.gamepad; if (!gp) continue;
        const x = gp.axes[2] || 0, y = gp.axes[3] || 0;
        if (src.handedness === 'left' && (Math.abs(x) > 0.15 || Math.abs(y) > 0.15)) { mx = x; my = y; }
        else if (src.handedness === 'right' && Math.abs(x) > 0.15) rig.rotation.y -= x * TURN_SPEED * dt;
      }
    } else {
      if (keys.w) my = -1; if (keys.s) my = 1; if (keys.a) mx = -1; if (keys.d) mx = 1;
    }
    if (mx || my) {
      cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      right.crossVectors(fwd, up);
      rig.position.addScaledVector(fwd, -my * MOVE_SPEED * dt);
      rig.position.addScaledVector(right, mx * MOVE_SPEED * dt);
    }

    // walk zone: gently stop at the edge
    cam.getWorldPosition(head);
    const dist = Math.hypot(head.x, head.z);
    if (dist > WALK_LIMIT) {
      const k = 1 - WALK_LIMIT / dist;
      rig.position.x -= head.x * k; rig.position.z -= head.z * k;
    }
    ring.material.opacity = Math.max(0, Math.min(1, (dist - 1.0) / 0.5)) * 0.6;

    // petals
    if (petals) {
      petalData.forEach((p, i) => {
        p.y -= p.s * dt;
        p.x += Math.sin(time * 1.3 + p.ph) * 0.15 * dt;
        p.z += Math.cos(time * 1.1 + p.ph) * 0.1 * dt;
        p.rx += dt * 1.5; p.ry += dt;
        if (p.y < 0) { p.y = 3.5; p.x = rand(-3, 3); p.z = rand(-3, 3); }
        dummy.position.set(p.x, p.y, p.z); dummy.rotation.set(p.rx, p.ry, 0); dummy.updateMatrix();
        petals.setMatrixAt(i, dummy.matrix);
      });
      petals.instanceMatrix.needsUpdate = true;
    }

    // butterflies
    butterflies.forEach(b => {
      const tt = time * b.sp + b.ph;
      const x = b.cx + Math.cos(tt) * b.a, z = b.cz + Math.sin(tt * 1.3) * b.a, y = b.cy + Math.sin(tt * 2.1) * 0.25;
      const nx = b.cx + Math.cos(tt + 0.05) * b.a, nz = b.cz + Math.sin((tt + 0.05) * 1.3) * b.a;
      b.holder.position.set(x, y, z);
      b.holder.lookAt(nx, y, nz);
      const flap = Math.sin(time * 14 + b.ph) * 0.9;
      b.right.rotation.z = flap; b.left.rotation.z = -flap;
    });

    // lanterns
    lanternGlows.forEach(l => {
      l.s.position.set(l.base.x + Math.sin(time * 1.1 + l.ph) * 0.04, l.base.y, l.base.z + Math.cos(time * 0.9 + l.ph) * 0.04);
      l.s.material.opacity = 0.55 + 0.3 * Math.sin(time * 2 + l.ph);
    });

    // fireflies
    if (fireflies) {
      const a = fireflies.geometry.attributes.position;
      ffBase.forEach((f, i) => {
        a.setXYZ(i, f[0] + Math.sin(time * 0.5 + f[3]) * 0.3, f[1] + Math.sin(time * 0.7 + f[3] * 2) * 0.2, f[2] + Math.cos(time * 0.4 + f[3]) * 0.3);
      });
      a.needsUpdate = true;
      cam.getWorldDirection(look);
      const lookUp = Math.max(0, Math.min(1, (look.y - 0.2) / 0.5));
      fireflies.material.opacity = 0.25 + 0.75 * lookUp;
    }

    renderer.render(scene, camera);
  });

  msg.textContent = 'Garden loaded. Tap anywhere for sound, then "ENTER VR".';
  setTimeout(() => { msg.style.display = 'none'; }, 7000);

} catch (err) {
  msg.textContent = 'Problem: ' + err.message + '. Check that photo.png and depth.png are in the same folder as this file.';
}
</script>
</body>
</html>
